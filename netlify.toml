# Static site + one serverless function. No build step: the dashboard is plain
# HTML/CSS/JS and parses spreadsheets in the browser.

[build]
  publish = "."
  functions = "netlify/functions"
  command = ""

[functions]
  node_bundler = "esbuild"

# Friendly path for the insights endpoint.
[[redirects]]
  from = "/api/insights"
  to = "/.netlify/functions/insights"
  status = 200
  force = true

[[redirects]]
  from = "/api/geocode"
  to = "/.netlify/functions/geocode"
  status = 200
  force = true

[[redirects]]
  from = "/api/surveys"
  to = "/.netlify/functions/surveys"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Survey data is private; keep it out of search indexes and shared caches.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
