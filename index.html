<style>
:root{
  --navy:#0E2439; --paper:#FFFFFF; --paper2:#F6F8FA; --paper3:#EDF1F5;
  --ink:#111C27; --ink2:#3C4C5C; --dim:#71808F;
  --rule:#BFC9D4; --rule2:#E2E7ED;
  --gold:#9C7C33; --gold2:#C4A45E;
  --subject:#0E2439; --subjectRing:#C4A45E; --comp:#8D9EB0;
  --pos:#1B6B4F; --neg:#9C3328;
  --serif:'EB Garamond',Garamond,'Times New Roman',serif;
  --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper2);color:var(--ink);font:14px/1.5 var(--serif);-webkit-font-smoothing:antialiased}
button,select{font-family:var(--sans);color:inherit}
table{font-variant-numeric:tabular-nums lining-nums}
.sheet{max-width:1560px;margin:0 auto;background:var(--paper);min-height:100vh;
  box-shadow:0 0 0 1px var(--rule2);padding:0 24px 34px}

/* masthead band */
.mast{background:var(--navy);margin:0 -24px 12px;padding:15px 24px 14px;
  border-bottom:3px double rgba(255,255,255,.34)}
.lh{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.lh img{height:31px;width:auto;display:block}
.lh .t{font:500 12px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--gold2);padding-bottom:3px}
.lh .r{margin-left:auto;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.lh .f{text-align:right}
.lh .f .k{font:500 8.5px var(--sans);letter-spacing:.17em;text-transform:uppercase;color:#8AA4BE}
.lh .f .v{font:500 13px var(--serif);letter-spacing:.01em;margin-top:1px;color:#fff}
.upload{border:1px solid #46617D;background:transparent;color:#fff;padding:7px 15px;cursor:pointer;
  font:500 9.5px var(--sans);letter-spacing:.15em;text-transform:uppercase;transition:.15s}
.upload:hover{background:#fff;color:var(--navy);border-color:#fff}
.dbl{display:none}

/* subject picker */
.subjwrap{display:flex;align-items:center;gap:7px;justify-content:flex-end}
select.subjsel{background:transparent;border:0;border-bottom:1px solid #46617D;color:#fff;
  font:500 15px var(--serif);letter-spacing:.01em;padding:1px 20px 2px 0;cursor:pointer;max-width:290px;
  appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8AA4BE 50%),linear-gradient(135deg,#8AA4BE 50%,transparent 50%);
  background-position:calc(100% - 9px) 55%,calc(100% - 4px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select.subjsel:hover{border-bottom-color:var(--gold2)}
select.subjsel option{background:var(--navy);color:#fff;font-size:13px}
.gear{background:transparent;border:1px solid #46617D;color:#8AA4BE;width:24px;height:24px;cursor:pointer;
  font-size:13px;line-height:1;padding:0;transition:.15s}
.gear:hover{color:#fff;border-color:#fff}
.saveflag{font:500 9px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);margin-top:3px}

/* manage panel */
.modal{position:fixed;inset:0;background:rgba(14,36,57,.55);display:none;place-items:center;z-index:70}
.modal.on{display:grid}
.mcard{background:#fff;width:min(560px,92vw);max-height:80vh;overflow:auto;box-shadow:0 24px 60px rgba(14,36,57,.34)}
.mcard .mh{background:var(--navy);color:#fff;padding:13px 20px;display:flex;justify-content:space-between;align-items:center}
.mcard .mh h3{font:500 11px var(--sans);letter-spacing:.19em;text-transform:uppercase}
.mcard .mh button{background:transparent;border:0;color:#8AA4BE;font-size:19px;cursor:pointer;line-height:1}
.mcard .mh button:hover{color:#fff}
.mrow{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--rule2)}
.mrow .i{flex:1;min-width:0}
.mrow .n{font:500 15px var(--serif)}
.mrow .s{font:400 10.5px var(--sans);color:var(--dim);margin-top:2px}
.mrow .act{display:flex;gap:7px}
.mrow.cur{background:#F1F4F8}
.mrow.cur .n{color:var(--gold)}
.mempty{padding:22px 20px;font:italic 400 14px var(--serif);color:var(--dim)}
.mfoot{padding:13px 20px;font:400 11.5px/1.55 var(--sans);color:var(--dim);background:var(--paper2)}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:7px 20px;align-items:center;padding:8px 12px;background:var(--paper2);
  border:1px solid var(--rule2);margin-bottom:12px}
.fg{display:flex;align-items:center;gap:6px}
.fg>label{font:500 8.5px var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
.seg{display:flex;border:1px solid var(--rule)}
.seg button{background:var(--paper);border:0;padding:3px 10px;font:500 10.5px var(--sans);color:var(--dim);cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
select{background:var(--paper);border:1px solid var(--rule);padding:3px 7px;font:500 10.5px var(--sans);cursor:pointer}
#winHint{font:400 10.5px var(--sans);color:var(--dim);max-width:330px;line-height:1.4}

/* grid */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:0 22px}
.g8{grid-column:span 8}.g4{grid-column:span 4}.g7{grid-column:span 7}.g5{grid-column:span 5}.g12{grid-column:span 12}
@media(max-width:1180px){.g8,.g4,.g7,.g5{grid-column:span 12}}

.blk{margin-bottom:20px}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--navy);padding-bottom:4px;margin-bottom:0}
.bh h2{font:500 12px var(--sans);letter-spacing:.19em;text-transform:uppercase;color:var(--navy)}
.bh .x{font:400 10.5px var(--sans);color:var(--dim);letter-spacing:.02em}

/* KPI ribbon */
.ribbon{display:grid;grid-template-columns:repeat(6,1fr);border-left:1px solid var(--rule2);margin-bottom:14px}
.met{padding:9px 12px;border-right:1px solid var(--rule2);border-bottom:1px solid var(--rule2)}
.met .k{font:500 8.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.met .v{font:500 22px/1.1 var(--serif);margin:4px 0 1px;font-variant-numeric:tabular-nums}
.met .d{font:500 10px var(--sans)}
.up{color:var(--pos)}.down{color:var(--neg)}.flat{color:var(--dim)}

/* observations — tight */
.bul{padding:6px 0;border-bottom:1px dotted var(--rule);font:400 14.5px/1.42 var(--serif);color:var(--ink)}
.bul:last-child{border-bottom:0}
.bul .tg{font:600 9px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--gold);margin-right:7px}
.aiNote{font:400 10.5px var(--sans);color:var(--dim);margin-top:7px}
.mini{border:1px solid var(--rule);background:transparent;padding:3px 9px;font:500 8.5px var(--sans);
  letter-spacing:.13em;text-transform:uppercase;cursor:pointer;color:var(--dim)}
.mini:hover{border-color:var(--navy);color:var(--navy)}

/* map */
.stack{display:flex;flex-direction:column}
.bh.maph{margin-top:16px}
.mapwrap{flex:1;min-height:238px;position:relative;margin-top:10px;border:1px solid var(--rule2);background:var(--paper2)}
#map{position:absolute;inset:0}
.leaflet-container{background:var(--paper2);font-family:var(--sans)}
.mapmsg{position:absolute;inset:0;display:none;place-items:center;padding:18px;text-align:center;
  background:var(--paper2);z-index:500}
.mapmsg.on{display:grid}
.mapmsg .in{max-width:280px}
.mapmsg p{font:400 13.5px/1.5 var(--serif);color:var(--ink2);margin-bottom:11px}
.mapmsg input{width:100%;border:1px solid var(--rule);padding:6px 9px;font:500 12px var(--sans);
  background:var(--paper);margin-bottom:8px;text-align:center}
.mapmsg input:focus{outline:0;border-color:var(--navy)}
.mapmsg .err{font:400 11px var(--sans);color:var(--neg);margin-top:7px}
.pin-sub{color:var(--gold);font-size:23px;line-height:1;text-shadow:0 0 3px #fff,0 0 6px #fff;cursor:pointer}
.pin-cmp{width:11px;height:11px;border-radius:50%;background:var(--comp);border:1.5px solid #fff;
  box-shadow:0 1px 3px rgba(14,36,57,.4);cursor:pointer}
.pin-cmp.dim{opacity:.35}
.leaflet-popup-content-wrapper{border-radius:2px;box-shadow:0 10px 28px rgba(14,36,57,.28)}
.leaflet-popup-content{margin:10px 13px;font:400 12.5px/1.5 var(--sans)}
.pop-n{font:500 15px var(--serif);color:var(--navy);display:block;margin-bottom:3px}
.pop-n.sub{color:var(--gold)}
.pop-a{color:var(--dim);font-size:11px;display:block;margin-bottom:6px}
.pop-r{display:flex;justify-content:space-between;gap:16px;font-variant-numeric:tabular-nums}
.pop-r span:first-child{color:var(--dim)}
.pop-b{margin-top:7px;border:1px solid var(--rule);background:transparent;padding:3px 8px;
  font:500 8.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--dim);width:100%}
.pop-b:hover{border-color:var(--navy);color:var(--navy)}

/* chart */
.chartwrap{height:392px;position:relative;padding:10px 2px 0}
#chart{width:100%;height:100%;position:relative}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:#EAF0F6;padding:8px 11px;
  font:400 11.5px/1.5 var(--sans);z-index:9;box-shadow:0 10px 28px rgba(14,36,57,.3);max-width:210px}
.tip b{display:block;color:var(--gold2);font-weight:600;margin-bottom:3px;font-size:12px}
.tip span{display:block;opacity:.8}
.empty{display:grid;place-items:center;height:100%;color:var(--dim);font:italic 400 14px var(--serif);text-align:center;padding:20px}
.cap{font:400 12.5px/1.5 var(--serif);color:var(--ink2);padding-top:7px;border-top:1px solid var(--rule2)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:5px;font:500 10px var(--sans);color:var(--dim)}
.sw{display:inline-block;width:13px;height:2px;vertical-align:middle;margin-right:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:6px}

/* tables */
table{width:100%;border-collapse:collapse;font:400 12.5px var(--sans)}
th{text-align:right;padding:6px 8px;font:500 8.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  border-bottom:1px solid var(--navy);white-space:nowrap;background:var(--paper);position:sticky;top:0;z-index:2}
th:first-child,td:first-child{text-align:left}
td{padding:5.5px 8px;text-align:right;border-bottom:1px solid var(--rule2);white-space:nowrap}
tbody tr.clik{cursor:pointer}
tbody tr:hover td{background:var(--paper2)}
tr.subj td{background:#F1F4F8;font-weight:500}
tr.subj td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.pname{font:500 13.5px var(--serif)}
.chev{color:var(--gold);margin-left:5px;font-size:11px}
.off{opacity:.4}
.tscroll{max-height:340px;overflow:auto}
.st{display:inline-block;padding:1px 6px;font:500 8.5px var(--sans);letter-spacing:.07em;text-transform:uppercase}
.st.a{background:#E7F0EB;color:var(--pos)}.st.p{background:#F6EFDF;color:var(--gold)}.st.l{background:#EBEFF4;color:var(--ink2)}
.offer{text-align:left;white-space:normal;max-width:250px;font:400 12.5px/1.42 var(--serif);color:var(--ink2)}
/* uniform rows: offers clamp to two lines and expand on click */
#specTbl td{height:52px;vertical-align:middle}
#specTbl td.offer{padding-top:7px;padding-bottom:7px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.offer.open .clamp{-webkit-line-clamp:unset;overflow:visible}
.offer.can{cursor:pointer}
.offer.can:hover .clamp{color:var(--navy)}
.more{display:none;font:500 8.5px var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--gold);margin-top:3px}
.offer.can .more{display:block}
.offer.can.open .more::after{content:'Less'}
.offer.can:not(.open) .more::after{content:'More'}
.muted{color:var(--dim);font-style:italic}
.warn{color:var(--neg)}
.foot{font:400 11px/1.55 var(--sans);color:var(--dim);border-top:1px solid var(--rule);padding-top:10px;margin-top:6px}
.drop{position:fixed;inset:0;background:rgba(14,36,57,.94);display:none;place-items:center;z-index:60;
  font:500 11px var(--sans);color:#fff;letter-spacing:.2em;text-transform:uppercase}
.drop.on{display:grid}

</style>

/* =============================================================================
   storage.js — saved market surveys, backed by Netlify Blobs.

   Same STORE interface the rest of the app already uses, but surveys now live
   server-side so they are shared across your devices and anyone else with
   access to the site. Because they are shared, protect the site (Netlify
   password protection or Identity) before circulating the URL.

   Two things stay local, because they are personal rather than shared:
     - which survey you had open last
     - an in-memory cache of payloads already fetched this session
   ========================================================================== */
(function (global) {
  'use strict';

  const API = '/api/surveys';
  const LAST = 'bsp-last-survey';

  const cache = new Map();     // key -> payload, this tab only
  let ready = null;            // null = untested, true/false after probe
  let lastError = '';

  async function req(method, opts) {
    const { key, body } = opts || {};
    const url = key ? API + '?key=' + encodeURIComponent(key) : API;
    const res = await fetch(url, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined
    });
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      const err = new Error((data && data.error) || 'HTTP ' + res.status);
      err.status = res.status;
      throw err;
    }
    return data || {};
  }

  /* localStorage holds only a ~40 byte preference, well clear of any quota. */
  function localGet(k) { try { return global.localStorage.getItem(k); } catch (e) { return null; } }
  function localSet(k, v) { try { global.localStorage.setItem(k, v); } catch (e) {} }
  function localDel(k) { try { global.localStorage.removeItem(k); } catch (e) {} }

  const STORE = {
    async probe() {
      if (ready !== null) return ready;
      try { await req('GET'); ready = true; }
      catch (e) { ready = false; lastError = e.message; }
      return ready;
    },
    available() { return ready !== false; },
    reason() { return lastError; },

    key(subject) {
      return String(subject).toLowerCase()
        .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 120) || 'survey';
    },

    async getIndex() {
      try { return (await req('GET')).index || []; }
      catch (e) { lastError = e.message; return []; }
    },

    async load(key) {
      if (cache.has(key)) return cache.get(key);
      try {
        const payload = (await req('GET', { key })).payload || null;
        if (payload) cache.set(key, payload);
        return payload;
      } catch (e) { lastError = e.message; return null; }
    },

    async save() {
      if (!(await this.probe())) {
        return { ok: false, reason: 'Shared storage is unreachable. ' + (lastError || '') };
      }
      const key = this.key(DB.subject);
      try {
        const payload = encodePayload();
        const out = await req('POST', { body: { key: key, payload: payload, savedBy: localGet('bsp-user') || '' } });
        cache.set(key, payload);
        localSet(LAST, key);
        return { ok: true, key: key, count: out.count, index: out.index };
      } catch (e) {
        return { ok: false, reason: e.message };
      }
    },

    async remove(key) {
      try {
        await req('DELETE', { key });
        cache.delete(key);
        if (localGet(LAST) === key) localDel(LAST);
        return true;
      } catch (e) { lastError = e.message; return false; }
    },

    async remember(key) { localSet(LAST, key); },
    async lastKey() { return localGet(LAST); }
  };

  global.STORE = STORE;
  STORE.probe();
})(window);

</script>
<script>
/* ===== ApartmentIQ Market Dashboard — shared engine ===================== */
const EPOCH = Date.UTC(2020,0,1);
const STATUS = ['Available','Applied','Leased'];
const DB = { props:[], fps:[], units:[], meta:{}, subject:null, asof:null, market:'', src:'' };
const S = {           // UI state
  win: 30, mode:'property', status:'avail', beds:'all',
  x:'sqft', y:'ask', trend:'both', props:new Set(), fp:'all'
};

/* ---------- load embedded payload ---------- */
function loadPayload(p){
  DB.props = p.props; DB.fps = p.fps; DB.meta = p.meta; DB.subject = p.subject;
  DB.asof = p.asof; DB.market = p.market||''; DB.src = p.src||'';
  DB.units = p.rows.map(r=>({
    prop:p.props[r[0]], fp:p.fps[r[1]], unit:r[2], beds:r[3], baths:r[4], sqft:r[5],
    status: typeof r[6]==='number' ? STATUS[r[6]] : r[6],
    dfa:r[7], lsd:r[8], dom:r[9], listed:r[10], ask:r[11], eff:r[12], conc:r[13]
  }));
  S.props=new Set(); DB.props.forEach(x=>S.props.add(x));
  S.fp='all';
}

/* Inverse of loadPayload — compact array-of-arrays for storage. Unknown status
   strings are kept verbatim rather than coerced to an index. */
function encodePayload(){
  const pi={}, fi={};
  DB.props.forEach((p,i)=>pi[p]=i); DB.fps.forEach((f,i)=>fi[f]=i);
  return { props:DB.props, fps:DB.fps, meta:DB.meta, subject:DB.subject, asof:DB.asof,
    market:DB.market, src:DB.src,
    rows: DB.units.map(u=>{ const si=STATUS.indexOf(u.status);
      return [pi[u.prop], fi[u.fp], u.unit, u.beds, u.baths, u.sqft, si>=0?si:u.status,
              u.dfa, u.lsd, u.dom, u.listed, u.ask, u.eff, u.conc]; }) };
}


/* ---------- parse an uploaded ApartmentIQ workbook ---------- */
function num(v){ if(v===''||v==null) return null; const n=+String(v).replace(/[$,%\s]/g,''); return isFinite(n)?n:null; }
function mdy(v){
  if(!v) return null;
  if(typeof v==='number'){ const d=new Date(Date.UTC(1899,11,30)+v*864e5); return Math.round((d-EPOCH)/864e5); }
  const m=String(v).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!m) return null;
  return Math.round((Date.UTC(+m[3],+m[1]-1,+m[2])-EPOCH)/864e5);
}
function findSheet(wb, want){
  const k = wb.SheetNames.find(n=>n.toLowerCase().trim()===want.toLowerCase());
  return k ? wb.Sheets[k] : null;
}
function parseWorkbook(wb){
  const uls = findSheet(wb,'Unit Level Data');
  if(!uls) throw new Error("This workbook has no “Unit Level Data” tab. Export the full market file from ApartmentIQ rather than a single-tab view.");

  // header sits on the 3rd row of every AIQ export
  const recs = XLSX.utils.sheet_to_json(uls,{range:2,defval:null});
  const col = (r,...names)=>{ for(const n of names){ for(const k in r){ if(k.replace(/\s+/g,' ').trim().toLowerCase()===n) return r[k]; } } return null; };
  const units=[];
  for(const r of recs){
    const prop = col(r,'property'); if(!prop) continue;
    units.push({
      prop:String(prop).trim(), fp:String(col(r,'floor plan')??'—').trim(), unit:String(col(r,'unit number')??'').trim(),
      beds:num(col(r,'bed count')), baths:num(col(r,'bath count')), sqft:num(col(r,'sq ft')),
      status:String(col(r,'unit status')??'').trim(),
      dfa:mdy(col(r,'date first available')), lsd:mdy(col(r,'leased date')),
      dom:num(col(r,'days on market')), listed:num(col(r,'times listed')),
      ask:num(col(r,'asking rent')), eff:num(col(r,'eff rent')),
      conc:num(col(r,'avg concession %'))
    });
  }
  if(!units.length) throw new Error('Found the Unit Level Data tab but no unit rows in it.');

  // property attributes — snapshot block only. AIQ stacks re-sorted ranking
  // blocks underneath it in the same columns, so stop at "Average".
  const meta={}; let subject=null;
  const vms = findSheet(wb,'Visual Market Survey');
  if(vms){
    for(const r of XLSX.utils.sheet_to_json(vms,{range:6,defval:null})){
      const n = r['Property Name']; if(!n || String(n).trim()==='Average') break;
      const d = num(r['Distance']);
      if(d===0) subject=String(n).trim();
      meta[String(n).trim()]={ dist:d, yr:num(r['Year Built']), tot:num(r['Total Units']),
        exp:num(r['Exposure %']), lsd:num(r['Leased %']), pre:num(r['Pre-Leased %']),
        conc:num(r['Concession %']), a7:num(r['Applications Last 7 Days']),
        a30:num(r['Applications Last 30 Days']), av:num(r['Total Avail. Units']), vac:num(r['Vacant Units']) };
    }
  }
  // concession language + reviews from the Market Survey grid (first occurrence wins)
  const msh = findSheet(wb,'Market Survey');
  if(msh){
    const grid = XLSX.utils.sheet_to_json(msh,{header:1,range:2,defval:null});
    const hdr=(grid[0]||[]).map(x=>x==null?'':String(x).trim()); const seen=new Set();
    for(const row of grid){
      const lbl=String(row[0]??'').trim();
      if(!['Concession Details','Reviews'].includes(lbl)||seen.has(lbl)) continue;
      seen.add(lbl);
      row.forEach((v,j)=>{ if(j<2||!hdr[j]||v==null||v==='') return;
        meta[hdr[j]] = meta[hdr[j]]||{};
        if(lbl==='Reviews') meta[hdr[j]].rev=num(v); else meta[hdr[j]].cd=String(v).trim(); });
    }
  }
  // street address per property (city/state are not in the export — user-supplied)
  const addrOf={};
  for(const r of recs){
    const p=col(r,'property'), a=col(r,'address');
    if(p && a && !addrOf[String(p).trim()]) addrOf[String(p).trim()]=String(a).trim();
  }
  for(const p in addrOf){ meta[p]=meta[p]||{}; if(!meta[p].addr) meta[p].addr=addrOf[p]; }

  const props=[...new Set(units.map(u=>u.prop))].sort();
  if(!subject){ // fall back to the smallest distance
    let best=Infinity; for(const p of props){ const d=meta[p]?.dist; if(d!=null&&d<best){best=d;subject=p;} }
    subject = subject || props[0];
  }
  const dates = units.map(u=>Math.max(u.dfa??-1,u.lsd??-1)).filter(d=>d>0);
  DB.props=props; DB.fps=[...new Set(units.map(u=>u.fp))].sort(); DB.units=units;
  DB.meta=meta; DB.subject=subject;
  DB.asof = new Date(EPOCH + Math.max(...dates)*864e5).toISOString().slice(0,10);
  DB.src  = 'Uploaded export';
  DB.market = DB.market || '';
  S.props=new Set(props); S.fp='all';
  return {units:units.length, props:props.length};
}

/* ---------- filtering ---------- */
function asofDay(){ return Math.round((Date.parse(DB.asof+'T00:00:00Z')-EPOCH)/864e5); }
/* The trailing window means different things by unit state, so each state gets
   its own date field. "On market" is a point-in-time state — a unit listed 200
   days ago is still available today — so the window does NOT narrow it. Use
   "Newly listed" when you want inventory that came to market inside the window. */
function activeUnits(){
  const cut = S.win==='all' ? -Infinity : asofDay()-S.win;
  return DB.units.filter(u=>{
    if(!S.props.has(u.prop)) return false;
    const leased = u.status==='Leased';
    switch(S.status){
      case 'avail':  if(leased) return false; break;
      case 'new':    if(leased || u.dfa==null || u.dfa<cut) return false; break;
      case 'leased': if(!leased || u.lsd==null || u.lsd<cut) return false; break;
      case 'all':    if(leased && (u.lsd==null || u.lsd<cut)) return false; break;
    }
    if(S.beds!=='all' && String(u.beds)!==S.beds) return false;
    if(S.mode==='floorplan' && S.fp!=='all' && !(u.prop===DB.subject && u.fp===S.fp)) return false;
    return true;
  });
}
/* what the window is actually doing right now — surfaced in the UI */
function windowHint(){
  if(S.win==='all') return 'No date limit.';
  switch(S.status){
    case 'avail':  return `Window inactive — every unit on the market today is shown. Switch to “Newly listed” to apply the ${S.win}-day window.`;
    case 'new':    return `Units that came to market in the last ${S.win} days.`;
    case 'leased': return `Units leased in the last ${S.win} days.`;
    case 'all':    return `All on-market units plus leases signed in the last ${S.win} days.`;
  }
  return '';
}

/* ---------- accessors + stats ---------- */
const AX = {
  sqft:{k:u=>u.sqft, label:'Square feet', fmt:v=>Math.round(v).toLocaleString()},
  dom :{k:u=>u.dom,  label:'Days on market', fmt:v=>Math.round(v)},
  date:{k:u=>u.status==='Leased'?u.lsd:u.dfa, label:'Date listed', fmt:v=>dayLabel(v)},
  ask :{k:u=>u.ask,  label:'Asking rent', fmt:v=>'$'+Math.round(v).toLocaleString()},
  eff :{k:u=>u.eff,  label:'Effective rent', fmt:v=>'$'+Math.round(v).toLocaleString()},
  apsf:{k:u=>u.sqft?u.ask/u.sqft:null, label:'Asking rent PSF', fmt:v=>'$'+v.toFixed(2)},
  epsf:{k:u=>u.sqft?u.eff/u.sqft:null, label:'Effective rent PSF', fmt:v=>'$'+v.toFixed(2)}
};
function dayLabel(d){ const dt=new Date(EPOCH+d*864e5); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'}); }
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const med  = a => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y),m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };

function ols(pts){
  const n=pts.length; if(n<3) return null;
  const mx=mean(pts.map(p=>p[0])), my=mean(pts.map(p=>p[1]));
  let sxy=0,sxx=0,syy=0;
  for(const [x,y] of pts){ sxy+=(x-mx)*(y-my); sxx+=(x-mx)**2; syy+=(y-my)**2; }
  if(!sxx) return null;
  const m=sxy/sxx, b=my-m*mx;
  return {m, b, r2: syy? (sxy*sxy)/(sxx*syy) : 0, n};
}

function propStats(units){
  const out={};
  for(const p of DB.props){
    const set = units.filter(u=>u.prop===p); if(!set.length) continue;
    const psf = set.filter(u=>u.sqft&&u.eff).map(u=>u.eff/u.sqft);
    out[p]={ n:set.length, ask:mean(set.map(u=>u.ask).filter(Boolean)),
      eff:mean(set.map(u=>u.eff).filter(Boolean)), sqft:mean(set.map(u=>u.sqft).filter(Boolean)),
      epsf:mean(psf), dom:med(set.map(u=>u.dom).filter(v=>v!=null)),
      conc:mean(set.map(u=>u.conc).filter(v=>v!=null)), ...(DB.meta[p]||{}) };
  }
  return out;
}
function fpStats(units, prop){
  const out={};
  for(const u of units.filter(x=>x.prop===prop)){
    (out[u.fp] = out[u.fp]||[]).push(u);
  }
  return Object.fromEntries(Object.entries(out).map(([k,set])=>[k,{
    n:set.length, beds:set[0].beds, sqft:mean(set.map(u=>u.sqft).filter(Boolean)),
    ask:mean(set.map(u=>u.ask).filter(Boolean)), eff:mean(set.map(u=>u.eff).filter(Boolean)),
    epsf:mean(set.filter(u=>u.sqft&&u.eff).map(u=>u.eff/u.sqft)),
    dom:med(set.map(u=>u.dom).filter(v=>v!=null))
  }]));
}

/* ---------- scatter (hand-rolled SVG) ---------- */
function drawScatter(el, theme){
  const units = activeUnits();
  const xa=AX[S.x], ya=AX[S.y];
  const pts = units.map(u=>({u, x:xa.k(u), y:ya.k(u)})).filter(p=>p.x!=null&&p.y!=null&&isFinite(p.x)&&isFinite(p.y));
  el.innerHTML='';
  if(pts.length<2){ el.innerHTML=`<div class="empty">No units match these filters. Widen the window or clear a filter.</div>`; return; }

  const W=el.clientWidth||900, H=el.clientHeight||460;
  const M={t:16,r:18,b:44,l:64};
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  let x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const padx=(x1-x0)*.06||1, pady=(y1-y0)*.10||1;
  x0-=padx; x1+=padx; y0-=pady; y1+=pady;
  const X=v=>M.l+(v-x0)/(x1-x0)*(W-M.l-M.r);
  const Y=v=>H-M.b-(v-y0)/(y1-y0)*(H-M.t-M.b);

  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('width','100%'); svg.setAttribute('height','100%');
  const add=(t,a,parent)=>{ const e=document.createElementNS(ns,t); for(const k in a) e.setAttribute(k,a[k]); (parent||svg).appendChild(e); return e; };

  const ticks=(lo,hi,n)=>{ const raw=(hi-lo)/n, mag=Math.pow(10,Math.floor(Math.log10(raw)));
    const step=[1,2,2.5,5,10].map(s=>s*mag).find(s=>s>=raw)||mag*10;
    const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi; v+=step) out.push(v); return out; };

  ticks(y0,y1,5).forEach(v=>{
    add('line',{x1:M.l,x2:W-M.r,y1:Y(v),y2:Y(v),stroke:theme.grid,'stroke-width':1});
    add('text',{x:M.l-10,y:Y(v)+4,'text-anchor':'end',fill:theme.dim,'font-size':11,'font-family':theme.mono}).textContent=ya.fmt(v);
  });
  ticks(x0,x1,6).forEach(v=>{
    add('line',{x1:X(v),x2:X(v),y1:M.t,y2:H-M.b,stroke:theme.grid,'stroke-width':1});
    add('text',{x:X(v),y:H-M.b+20,'text-anchor':'middle',fill:theme.dim,'font-size':11,'font-family':theme.mono}).textContent=xa.fmt(v);
  });
  add('text',{x:(M.l+W-M.r)/2,y:H-6,'text-anchor':'middle',fill:theme.dim,'font-size':11,'letter-spacing':'.08em'}).textContent=xa.label.toUpperCase();
  const yl=add('text',{x:14,y:(M.t+H-M.b)/2,'text-anchor':'middle',fill:theme.dim,'font-size':11,'letter-spacing':'.08em'});
  yl.setAttribute('transform',`rotate(-90 14 ${(M.t+H-M.b)/2})`); yl.textContent=ya.label.toUpperCase();

  // trend lines
  const line=(set,color,dash)=>{
    const f=ols(set.map(p=>[p.x,p.y])); if(!f) return null;
    const a=Math.max(x0,Math.min(...set.map(p=>p.x))), b=Math.min(x1,Math.max(...set.map(p=>p.x)));
    add('line',{x1:X(a),y1:Y(f.m*a+f.b),x2:X(b),y2:Y(f.m*b+f.b),stroke:color,'stroke-width':2,
      'stroke-dasharray':dash||'','stroke-linecap':'round',opacity:.9});
    return f;
  };
  const subPts=pts.filter(p=>p.u.prop===DB.subject), cmpPts=pts.filter(p=>p.u.prop!==DB.subject);
  let fitC=null, fitS=null;
  if(S.mode==='property'){
    if(S.trend!=='subject') fitC=line(cmpPts,theme.comp,'6 5');
    if(S.trend!=='comps')   fitS=line(subPts,theme.subject);
  } else {
    if(S.trend!=='none') fitS=line(pts,theme.subject);
  }

  // dots
  const fpColors={}; let ci=0;
  if(S.mode==='floorplan') [...new Set(pts.map(p=>p.u.fp))].forEach(f=>fpColors[f]=theme.palette[ci++%theme.palette.length]);
  const tip=el.querySelector('.tip')||Object.assign(document.createElement('div'),{className:'tip'});
  tip.style.display='none'; el.appendChild(tip);

  const order=[...cmpPts,...subPts];       // subject drawn last, on top
  for(const p of order){
    const isSub = p.u.prop===DB.subject;
    const fill = S.mode==='floorplan' ? fpColors[p.u.fp] : (isSub?theme.subject:theme.comp);
    const c=add('circle',{cx:X(p.x),cy:Y(p.y),r:isSub&&S.mode==='property'?5.5:4,
      fill, opacity:isSub||S.mode==='floorplan'?.95:(theme.compOpacity??.42),
      stroke:isSub&&S.mode==='property'?theme.subjectRing:'none','stroke-width':1.5});
    c.style.cursor='crosshair';
    c.addEventListener('mouseenter',ev=>{
      c.setAttribute('r',7);
      tip.innerHTML=`<b>${p.u.prop}</b><span>${p.u.fp} · ${p.u.unit||'—'}</span>
        <span>${p.u.beds}bd/${p.u.baths}ba · ${p.u.sqft?p.u.sqft.toLocaleString()+' sf':'—'}</span>
        <span>Ask ${p.u.ask?'$'+p.u.ask.toLocaleString():'—'} · Eff ${p.u.eff?'$'+p.u.eff.toLocaleString():'—'}</span>
        <span>${p.u.status} · ${p.u.dom!=null?p.u.dom+' DOM':'—'}${p.u.conc?' · '+(p.u.conc*100).toFixed(1)+'% conc':''}</span>`;
      tip.style.display='block';
      const r=el.getBoundingClientRect();
      tip.style.left=Math.min(X(p.x)+14, r.width-210)+'px';
      tip.style.top=Math.max(Y(p.y)-10,4)+'px';
    });
    c.addEventListener('mouseleave',()=>{ c.setAttribute('r',isSub&&S.mode==='property'?5.5:4); tip.style.display='none'; });
  }
  el.insertBefore(svg, tip);
  return {fitC, fitS, n:pts.length, nSub:subPts.length};
}

/* Concession economics per property. AIQ gives concession as a % of annual
   rent, so 8.33% ≈ one month free; ×52 converts to a weeks-free equivalent
   that leasing teams actually quote. */
function concessionBoard(units){
  const st=propStats(units), out=[];
  for(const [p,v] of Object.entries(st)){
    const gap = (v.ask!=null&&v.eff!=null) ? v.ask-v.eff : null;
    out.push({ prop:p, isSubject:p===DB.subject, conc:v.conc, gapMo:gap,
      weeks: v.conc!=null ? v.conc*52 : null,
      annual: gap!=null ? gap*12 : null,
      offer: v.cd || null, ask:v.ask, eff:v.eff, n:v.n });
  }
  return out.sort((a,b)=>(b.conc??-1)-(a.conc??-1));
}
function buildBrief(){
  const units=activeUnits(), st=propStats(units), sub=st[DB.subject];
  const comps=Object.entries(st).filter(([p])=>p!==DB.subject).map(([,v])=>v);
  if(!sub||!comps.length) return null;
  const avg=k=>mean(comps.map(c=>c[k]).filter(v=>v!=null));
  const rank=k=>{ const all=Object.entries(st).map(([p,v])=>[p,v[k]]).filter(x=>x[1]!=null)
      .sort((a,b)=>b[1]-a[1]); return [all.findIndex(x=>x[0]===DB.subject)+1, all.length]; };
  return {
    market:DB.market, asof:DB.asof, subject:DB.subject, window:S.win, beds:S.beds, statusFilter:S.status,
    subjectProfile:{ yearBuilt:sub.yr, units:sub.tot, distanceMi:0, reviews:sub.rev,
      exposurePct:sub.exp, leasedPct:sub.lsd, preLeasedPct:sub.pre, apps7:sub.a7, apps30:sub.a30,
      concessionOffer:sub.cd },
    subjectPricing:{ n:sub.n, avgAsking:Math.round(sub.ask), avgEffective:Math.round(sub.eff),
      avgSqft:Math.round(sub.sqft), effPSF:+sub.epsf?.toFixed(2), medianDOM:sub.dom,
      concessionPct:+(sub.conc*100).toFixed(1) },
    compSet:{ n:comps.length, avgAsking:Math.round(avg('ask')), avgEffective:Math.round(avg('eff')),
      avgSqft:Math.round(avg('sqft')), effPSF:+avg('epsf')?.toFixed(2), medianDOM:med(comps.map(c=>c.dom).filter(v=>v!=null)),
      concessionPct:+(avg('conc')*100).toFixed(1), avgYearBuilt:Math.round(avg('yr')), avgExposure:avg('exp') },
    ranks:{ effectiveRent:rank('eff'), effPSF:rank('epsf'), concession:rank('conc'), exposure:rank('exp') },
    byProperty:Object.entries(st).map(([p,v])=>({property:p, isSubject:p===DB.subject, distanceMi:v.dist,
      yearBuilt:v.yr, totalUnits:v.tot, listings:v.n, avgAsking:Math.round(v.ask), avgEffective:Math.round(v.eff),
      effPSF:+v.epsf?.toFixed(2), medianDOM:v.dom, concessionPct:+(v.conc*100).toFixed(1),
      exposurePct:v.exp!=null?+(v.exp*100).toFixed(1):null, concessionOffer:v.cd}))
      .sort((a,b)=>b.effPSF-a.effPSF)
  };
}
function localRead(b){
  if(!b) return [{tag:'No data',text:'Not enough data in the current filter to form a read.'}];
  const d=(a,c)=>((a-c)/c*100), o=[];
  const eff=d(b.subjectPricing.avgEffective,b.compSet.avgEffective);
  const ask=d(b.subjectPricing.avgAsking,b.compSet.avgAsking);
  const psf=d(b.subjectPricing.effPSF,b.compSet.effPSF);
  o.push({tag:'Pricing gap',text:`Asking ${Math.abs(ask).toFixed(1)}% ${ask>=0?'over':'under'} comps; effective ${Math.abs(eff).toFixed(1)}% ${eff>=0?'over':'under'}. Concessions absorb it.`});
  o.push({tag:'Concessions',text:`${b.subjectPricing.concessionPct}% vs ${b.compSet.concessionPct}% comp avg. Rank ${b.ranks.concession[0]}/${b.ranks.concession[1]}.`});
  o.push({tag:'Net PSF',text:`$${b.subjectPricing.effPSF} vs $${b.compSet.effPSF}, ${Math.abs(psf).toFixed(1)}% ${psf>=0?'over':'under'}. Rank ${b.ranks.effPSF[0]}/${b.ranks.effPSF[1]}.`});
  if(b.subjectProfile.yearBuilt&&b.compSet.avgYearBuilt)
    o.push({tag:'Vintage',text:`${b.subjectProfile.yearBuilt} vs ${b.compSet.avgYearBuilt} avg. Part of the PSF gap is product, not price.`});
  if(b.subjectProfile.apps7!=null)
    o.push({tag:'Velocity',text:`${b.subjectProfile.apps7} apps in 7d, ${b.subjectProfile.apps30} in 30d, at ${(b.subjectProfile.exposurePct*100).toFixed(1)}% exposure.`});
  return o;
}

/* ---------- AI insights ---------- */
/* The prompt lives server-side in netlify/functions/insights.js so this endpoint
   can't be reused as a general-purpose proxy for the API key. */
const AI_ENDPOINT = (typeof window!=='undefined' && window.AI_ENDPOINT) || '/api/insights';
async function runAI(brief, render, note){
  if(!brief){ render(localRead(null)); return; }
  try{
    const res = await fetch(AI_ENDPOINT,{ method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({ brief }) });
    if(!res.ok){
      let d=''; try{ d=(await res.json()).error||''; }catch(_){}
      throw new Error(d||('HTTP '+res.status));
    }
    let arr=(await res.json()).bullets;
    if(!Array.isArray(arr)||!arr.length) throw new Error('empty response');
    arr = arr.map(x=>typeof x==='string'?{tag:'',text:x}:{tag:x.tag||'',text:x.text||''}).filter(x=>x.text);
    if(!arr.length) throw new Error('empty response');
    render(arr);
  }catch(e){
    render(localRead(brief));
    if(note) note('Showing the built-in read — the insights service did not return. ('+e.message+')');
  }
}

};
function delta(a,c){ if(a==null||c==null||!c) return null; return (a-c)/c*100; }

    const sl=f=>f?`${AX[S.y].fmt(Math.abs(f.m))} ${unit} (R² ${f.r2.toFixed(2)}, n=${f.n})`:'—';
    let c=`${S.status==='avail'?'Units presently on the market':S.status==='new'?'Units newly listed in the window':S.status==='leased'?'Units leased within the window':'All units'}${S.beds!=='all'?`, ${S.beds==='0'?'studios':S.beds+'-bedroom only'}`:''}. `;
    if(r.fitS&&r.fitC&&S.mode==='property'){
      const gap=r.fitS.m-r.fitC.m;
      c+=`Subject fit ${sl(r.fitS)} vs. ${sl(r.fitC)} for the set — ${gap>=0?'steeper':'flatter'}.`;
    } else if(r.fitS) c+=`Fitted slope ${sl(r.fitS)}.`;
    $('#caption').textContent=c;
  } else $('#caption').textContent='';

  renderTable(units,st); renderSpecials(units);
  drawMap();
}

function renderTable(units,st){
  const T=$('#tbl'), A=$('#tblAction');
  if(drill){
    const set=units.filter(u=>u.prop===drill).sort((a,b)=>(a.beds-b.beds)||((b.eff??0)-(a.eff??0)));
    const m=DB.meta[drill]||{};
    $('#tblTitle').textContent=drill;
    A.innerHTML=`${set.length} units${m.yr?' · '+m.yr:''} &nbsp;<button class="mini" id="back">← Comp set</button>`;
    $('#back').onclick=()=>{drill=null;render()};
    const badge=s=>`<span class="st ${s==='Available'?'a':s==='Applied'?'p':'l'}">${s}</span>`;
    T.innerHTML=`<thead><tr><th>Unit</th><th>Plan</th><th>Bd/Ba</th><th>SF</th><th>Status</th><th>Listed</th>
      <th>Days</th><th>Ask</th><th>Eff.</th><th>PSF</th><th>Conc.</th></tr></thead><tbody>`+
      (set.length?set.map(u=>`<tr class="${drill===DB.subject?'subj':''}">
        <td>${u.unit||'—'}</td><td>${u.fp}</td><td>${u.beds}/${u.baths??'—'}</td><td>${F.n(u.sqft)}</td>
        <td>${badge(u.status)}</td><td>${u.dfa!=null?dayLabel(u.dfa):'—'}</td><td>${F.d(u.dom)}</td>
        <td>${F.$(u.ask)}</td><td>${F.$(u.eff)}</td><td>${u.sqft&&u.eff?F.psf(u.eff/u.sqft):'—'}</td>
        <td>${u.conc!=null?F.pct(u.conc):'—'}</td></tr>`).join('')
       :'<tr><td colspan="11" class="muted" style="text-align:center;padding:22px">No units match the current filters.</td></tr>')+'</tbody>';
    return;
  }
  if(S.mode==='floorplan'){
    $('#tblTitle').textContent=`${DB.subject} — floor plans`; A.textContent='';
    const fs=fpStats(units,DB.subject);
    T.innerHTML=`<thead><tr><th>Floor plan</th><th>Bd</th><th>Avg SF</th><th>Listed</th><th>Ask</th><th>Eff.</th><th>PSF</th><th>Days</th></tr></thead><tbody>`+
      Object.entries(fs).sort((a,b)=>b[1].epsf-a[1].epsf).map(([k,v])=>
      `<tr><td class="pname">${k}</td><td>${v.beds}</td><td>${F.n(v.sqft)}</td><td>${v.n}</td><td>${F.$(v.ask)}</td><td>${F.$(v.eff)}</td><td>${F.psf(v.epsf)}</td><td>${F.d(v.dom)}</td></tr>`).join('')+'</tbody>';
    return;
  }
  $('#tblTitle').textContent='Competitive set';
  A.textContent='Row for units · name to exclude';
  T.innerHTML=`<thead><tr><th>Property</th><th>Mi</th><th>Built</th><th>Units</th><th>Listed</th><th>Ask</th>
    <th>Eff.</th><th>PSF</th><th>Conc.</th><th>Expo.</th><th>Days</th></tr></thead><tbody>`+
    Object.entries(st).sort((a,b)=>b[1].epsf-a[1].epsf).map(([p,v])=>
    `<tr class="clik ${p===DB.subject?'subj':''} ${S.props.has(p)?'':'off'}" data-p="${p}">
      <td><span class="pname">${p}</span><span class="chev">›</span></td><td>${v.dist??'—'}</td><td>${v.yr||'—'}</td>
      <td>${v.tot||'—'}</td><td>${v.n}</td><td>${F.$(v.ask)}</td><td>${F.$(v.eff)}</td><td>${F.psf(v.epsf)}</td>
      <td>${F.pct(v.conc)}</td><td>${F.pct(v.exp)}</td><td>${F.d(v.dom)}</td></tr>`).join('')+'</tbody>';
  T.querySelectorAll('tbody tr.clik').forEach(tr=>tr.onclick=e=>{
    const p=tr.dataset.p;
    if(e.target.closest('.pname')){ S.props.has(p)?S.props.delete(p):S.props.add(p);
      if(!S.props.size) DB.props.forEach(x=>S.props.add(x)); render(); }
    else { drill=p; render(); }});
}

function renderSpecials(units){
  const board=concessionBoard(units);
  $('#specCount').textContent=`${board.filter(b=>(b.conc||0)>0.005).length} of ${board.length} offering`;
  $('#specTbl').innerHTML=`<thead><tr><th>Property</th><th>Rate</th><th>Wks</th><th>Spread/mo</th><th>Annual</th><th>Advertised offer</th></tr></thead><tbody>`+
    (board.length?board.map(b=>{
      const live=b.gapMo!=null&&b.gapMo>=1, stale=!live&&(b.conc||0)>0.02;
      return `<tr class="${b.isSubject?'subj':''}"><td><span class="pname">${b.prop}</span></td>
        <td>${b.conc!=null?(b.conc*100).toFixed(1)+'%':'—'}</td><td>${b.weeks!=null?b.weeks.toFixed(1):'—'}</td>
        <td class="${stale?'warn':''}">${live?F.$(b.gapMo):stale?'Not listed':'—'}</td>
        <td>${live?F.$(b.annual):'—'}</td>
        <td class="offer"><div class="clamp">${b.offer||'<span class="muted">None</span>'}</div><div class="more"></div></td></tr>`;}).join('')
     :'<tr><td colspan="6" class="muted" style="text-align:center;padding:22px">No properties in filter.</td></tr>')+'</tbody>';
  markTruncated();
}

/* Rows are a fixed height with the offer clamped to two lines. Only cells whose
   text actually overflows become clickable, so there is no dead affordance. */
function markTruncated(){
  requestAnimationFrame(()=>{
    document.querySelectorAll('#specTbl td.offer').forEach(td=>{
      const c=td.querySelector('.clamp'); if(!c) return;
      td.classList.remove('open');
      if(c.scrollHeight>c.clientHeight+1) td.classList.add('can');
      else td.classList.remove('can');
    });
  });
}
document.addEventListener('click',e=>{
  const td=e.target.closest('#specTbl td.offer.can'); if(!td) return;
  td.classList.toggle('open');
});

function refreshAI(){
  $('#ai').innerHTML='<div class="bul muted">Reading the market…</div>'; $('#aiNote').textContent='';
  runAI(buildBrief(), arr=>{ $('#ai').innerHTML=arr.map(b=>
    `<div class="bul"><span class="tg">${b.tag||'Note'}</span>${b.text}</div>`).join(''); },
    m=>{ $('#aiNote').textContent=m; });
}
$('#rerun').onclick=refreshAI;

/* ================= location map ================= */
let MAP=null, MAPLAYER=null, MAPKEY=null;
const GEO_ENDPOINT='/api/geocode';

function coordsFor(){
  const out=[];
  for(const p of DB.props){
    const m=DB.meta[p]||{};
    if(isFinite(m.lat)&&isFinite(m.lng)) out.push({prop:p, lat:+m.lat, lng:+m.lng, addr:m.addr||''});
  }
  return out;
}
function missingAddrs(){
  return DB.props.filter(p=>{const m=DB.meta[p]||{}; return m.addr && !(isFinite(m.lat)&&isFinite(m.lng));})
                 .map(p=>({prop:p, address:DB.meta[p].addr}));
}

function mapMsg(html){ const el=$('#mapMsg'); if(!html){el.classList.remove('on');el.innerHTML='';return;}
  el.innerHTML='<div class="in">'+html+'</div>'; el.classList.add('on'); }

function promptCity(err){
  mapMsg(`<p>Property locations aren't in the ApartmentIQ export. Enter the city and state to place them.</p>
    <input id="cityIn" placeholder="Colorado Springs, CO" value="${(DB.market||'').replace(/"/g,'&quot;')}">
    <button class="mini" id="cityGo" style="width:100%">Locate properties</button>
    ${err?`<div class="err">${err}</div>`:''}`);
  const go=$('#cityGo'), inp=$('#cityIn');
  inp.focus();
  const run=()=>doGeocode(inp.value.trim());
  go.onclick=run;
  inp.onkeydown=e=>{ if(e.key==='Enter') run(); };
}

/* Browser-side fallback when /api/geocode isn't reachable. Census only — no
   Nominatim, whose usage policy rules out unattended calls from a page. */
async function clientGeocode(city, items){
  const out={};
  for(const it of items){
    try{
      const u='https://geocoding.geo.census.gov/geocoders/locations/onelineaddress'
        +'?address='+encodeURIComponent(it.address+', '+city)
        +'&benchmark=Public_AR_Current&format=json';
      const r=await fetch(u);
      if(!r.ok){ out[it.prop]=null; continue; }
      const m=(await r.json())?.result?.addressMatches?.[0];
      out[it.prop]= m&&m.coordinates ? {lat:+m.coordinates.y, lng:+m.coordinates.x} : null;
    }catch(e){ out[it.prop]=null; }
  }
  return out;
}

async function doGeocode(city){
  if(!city){ promptCity('Enter a city and state, e.g. Colorado Springs, CO'); return; }
  const items=missingAddrs();
  if(!items.length){ drawMap(); return; }
  mapMsg(`<p>Locating ${items.length} propert${items.length===1?'y':'ies'} in ${city}…</p>`);
  try{
    let coords, found, total;
    try{
      const res=await fetch(GEO_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({city, items})});
      if(!res.ok){ let m=''; try{ m=(await res.json()).error||''; }catch(_){}
        throw new Error(m||('HTTP '+res.status)); }
      ({coords, found, total}=await res.json());
    }catch(serverErr){
      // No geocode function (e.g. previewing this file outside the deployed site).
      // Fall back to calling the Census geocoder straight from the browser.
      coords=await clientGeocode(city, items);
      total=items.length; found=Object.values(coords).filter(Boolean).length;
      if(!found) throw serverErr;
    }
    let hit=0;
    for(const p in coords){ if(coords[p]){ DB.meta[p]=DB.meta[p]||{};
      DB.meta[p].lat=coords[p].lat; DB.meta[p].lng=coords[p].lng; hit++; } }
    DB.market=city;
    if(!hit){ promptCity('No addresses matched in that city. Check the spelling or try "City, ST".'); return; }
    $('#mkt').textContent=city;
    if(CURKEY!==SAMPLE && STORE.available()){ await STORE.save(); await refreshIndex(); paintPicker(); }
    drawMap();
    if(found<total) $('#mapNote').textContent=`${found} of ${total} located`;
  }catch(e){ promptCity('Could not reach the location service. ('+e.message+')'); }
}

function drawMap(){
  const pts=coordsFor();
  if(!pts.length){
    if(missingAddrs().length) promptCity();
    else mapMsg('<p>No street addresses in this export, so the properties cannot be placed on a map.</p>');
    return;
  }
  if(typeof L==='undefined'){ mapMsg('<p>Map library unavailable.</p>'); return; }
  mapMsg('');
  if(!MAP){
    MAP=L.map('map',{scrollWheelZoom:false, attributionControl:true});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      {maxZoom:19, attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(MAP);
    MAP.on('click',()=>{});
  }
  if(MAPLAYER) MAPLAYER.remove();
  MAPLAYER=L.layerGroup().addTo(MAP);

  const st=propStats(activeUnits());
  for(const pt of pts){
    const isSub = pt.prop===DB.subject;
    const on = S.props.has(pt.prop);
    const icon = isSub
      ? L.divIcon({className:'', html:'<div class="pin-sub">&#9733;</div>', iconSize:[23,23], iconAnchor:[11,11]})
      : L.divIcon({className:'', html:`<div class="pin-cmp${on?'':' dim'}"></div>`, iconSize:[11,11], iconAnchor:[6,6]});
    const v=st[pt.prop]||{};
    const row=(k,val)=>`<div class="pop-r"><span>${k}</span><span>${val}</span></div>`;
    const m=L.marker([pt.lat,pt.lng],{icon, zIndexOffset:isSub?1000:0}).addTo(MAPLAYER);
    m.bindPopup(`<span class="pop-n ${isSub?'sub':''}">${pt.prop}</span>
      <span class="pop-a">${pt.addr}${v.dist!=null?' · '+v.dist+' mi':''}${v.yr?' · built '+v.yr:''}</span>
      ${row('Effective', F.$(v.eff))}${row('Eff. PSF', F.psf(v.epsf))}
      ${row('Concession', F.pct(v.conc))}${row('Listed', v.n??'—')}
      <button class="pop-b" data-drill="${encodeURIComponent(pt.prop)}">Unit detail</button>`);
  }
  MAP.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lng])),{padding:[26,26], maxZoom:14});
  setTimeout(()=>MAP.invalidateSize(),60);
  $('#mapNote').textContent=`${pts.length} located`;
}

/* popup button -> drill-down (popups are outside the table's listeners) */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-drill]'); if(!b) return;
  drill=decodeURIComponent(b.dataset.drill); if(MAP) MAP.closePopup(); render();
  document.getElementById('tbl').scrollIntoView({behavior:'smooth',block:'center'});
});

/* ================= saved surveys: picker, persistence, manage ================= */
const SAMPLE='__sample__';
let INDEX=[], CURKEY=SAMPLE;
const dayFmt=d=>new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

async function refreshIndex(){ INDEX = STORE.available() ? await STORE.getIndex() : []; }

/* The bundled sample is a first-run demo only. Once any survey is saved it is
   dropped from the list — otherwise loading an export for the sample property
   would show that name twice, once as demo and once as saved. */
function paintPicker(){
  const sel=$('#selSubject'), flag=$('#saveFlag');
  const saved=INDEX.some(e=>e.key===CURKEY);
  const showSample = !INDEX.length && !!DB.subject;
  const opts=INDEX.map(e=>`<option value="${e.key}">${e.subject}</option>`);
  if(showSample) opts.unshift(`<option value="${SAMPLE}">${DB.subject} (sample)</option>`);
  sel.innerHTML=opts.join('');
  sel.value = saved ? CURKEY : (showSample ? SAMPLE : (INDEX.length ? INDEX[0].key : ''));
  if(!STORE.available())      flag.textContent='Session only — storage unavailable';
  else if(!saved)             flag.textContent='Sample — not saved';
  else { const e=INDEX.find(x=>x.key===CURKEY);
         flag.textContent = e ? 'Saved '+dayFmt(e.savedAt) : ''; }
}

async function openSurvey(key){
  if(key===SAMPLE){ if(!PAYLOAD) return; loadPayload(PAYLOAD); CURKEY=SAMPLE; boot(); paintPicker(); return; }
  const p=await STORE.load(key);
  if(!p){ $('#aiNote').textContent='That saved survey could not be read. It may have been cleared.';
          await refreshIndex(); paintPicker(); return; }
  loadPayload(p); CURKEY=key; await STORE.remember(key); boot(); paintPicker();
}
$('#selSubject').onchange=e=>openSurvey(e.target.value);

/* manage panel */
const modal=$('#modal');
$('#btnManage').onclick=()=>{ paintManage(); modal.classList.add('on'); };
$('#mClose').onclick=()=>modal.classList.remove('on');
modal.onclick=e=>{ if(e.target===modal) modal.classList.remove('on'); };

function paintManage(){
  const L=$('#mList'), Ft=$('#mFoot');
  if(!STORE.available()){
    L.innerHTML='<div class="mempty">Saved surveys are unavailable in this view. Exports you load will apply to this session only.</div>';
    Ft.textContent=''; return;
  }
  if(!INDEX.length){
    L.innerHTML='<div class="mempty">No saved surveys yet. Load an ApartmentIQ export and it will be stored here under its subject property.</div>';
  } else {
    L.innerHTML=INDEX.map(e=>`<div class="mrow ${e.key===CURKEY?'cur':''}">
      <div class="i"><div class="n">${e.subject}</div>
        <div class="s">${e.market||'—'} · ${e.props} properties · ${e.units.toLocaleString()} units · data as of ${e.asof} · saved ${dayFmt(e.savedAt)}</div></div>
      <div class="act"><button class="mini" data-open="${e.key}">Open</button>
        <button class="mini" data-del="${e.key}">Delete</button></div></div>`).join('');
  }
  Ft.textContent=`${INDEX.length} survey${INDEX.length===1?'':'s'} stored. Re-loading an export for the same property replaces its saved copy, so a weekly refresh overwrites rather than duplicates.`;
  L.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{
    modal.classList.remove('on'); await openSurvey(b.dataset.open); });
  L.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='Confirm'; b.style.color='#9C3328'; b.style.borderColor='#9C3328';
      setTimeout(()=>{ if(b.isConnected&&b.dataset.armed==='1'){b.dataset.armed='0';b.textContent='Delete';b.style.color='';b.style.borderColor='';} },3500);
      return; }
    const k=b.dataset.del;
    await STORE.remove(k); await refreshIndex();
    if(CURKEY===k){                       // fall through to the next saved survey, not the demo
      if(INDEX.length) await openSurvey(INDEX[0].key);
      else if(PAYLOAD){ loadPayload(PAYLOAD); CURKEY=SAMPLE; boot(); }
    }
    paintPicker(); paintManage(); });
}

/* upload */
$('#btnUp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0]; if(f) ingest(f); e.target.value='';};
const dz=$('#drop'); let dc=0;
addEventListener('dragenter',e=>{e.preventDefault();dc++;dz.classList.add('on')});
addEventListener('dragleave',e=>{e.preventDefault();if(--dc<=0)dz.classList.remove('on')});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;dz.classList.remove('on');const f=e.dataTransfer.files[0]; if(f) ingest(f);});
function ingest(file){
  dz.textContent='Reading '+file.name+'…'; dz.classList.add('on');
  const rd=new FileReader();
  rd.onload=async ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      const r=parseWorkbook(wb);
      dz.classList.remove('on');
      const res=await STORE.save();
      await refreshIndex();
      CURKEY = res.ok ? res.key : SAMPLE;
      boot(); paintPicker();
      $('#aiNote').textContent = res.ok
        ? `Loaded ${r.units.toLocaleString()} units across ${r.props} properties. Saved as “${DB.subject}” — ${res.count} survey${res.count===1?'':'s'} stored.`
        : `Loaded ${r.units.toLocaleString()} units across ${r.props} properties. ${res.reason} This session only.`;
    }catch(err){ dz.textContent=err.message; setTimeout(()=>dz.classList.remove('on'),4200); }
  };
  rd.readAsArrayBuffer(file);
}
addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(modal.classList.contains('on')) modal.classList.remove('on');
  else if(drill){drill=null;render();} } });
addEventListener('resize',()=>render());

/* boot: render the sample instantly, then restore the last survey if one exists */
let PAYLOAD=null;

async function loadSample(){ PAYLOAD = SAMPLE_PAYLOAD; return !!PAYLOAD; }

function emptyState(msg){
  document.querySelector('.grid').innerHTML=
    `<div class="g12" style="padding:60px 0;text-align:center">
       <div style="font:400 19px var(--serif);color:var(--ink2)">${msg}</div>
       <div style="font:400 13px var(--sans);color:var(--dim);margin-top:9px">
         Use <strong>Load export</strong> above, or drag an ApartmentIQ .xlsx anywhere onto this page.</div></div>`;
  document.getElementById('band').innerHTML='';
}

(async function init(){
  await STORE.probe();
  await refreshIndex();
  const last=await STORE.lastKey();
  if(last && INDEX.some(e=>e.key===last)){ await openSurvey(last); await loadSample(); paintPicker(); return; }
  if(INDEX.length){ await openSurvey(INDEX[0].key); await loadSample(); paintPicker(); return; }
  if(await loadSample()){ loadPayload(PAYLOAD); CURKEY=SAMPLE; boot(); }
  else emptyState('No survey loaded yet.');
  paintPicker();
})();

</script>
